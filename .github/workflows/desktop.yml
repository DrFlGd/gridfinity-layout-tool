name: Desktop (Tauri)

on:
  pull_request:
    paths:
      - 'desktop/**'
      - 'src-tauri/**'
      - 'docs/desktop.md'
      - 'package.json'
      - 'tsconfig.node.json'
      - '.github/workflows/desktop.yml'
  push:
    branches: [main]
    paths:
      - 'desktop/**'
      - 'src-tauri/**'
      - 'docs/desktop.md'
      - 'package.json'
      - 'tsconfig.node.json'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: desktop-windows-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      VITE_SELF_HOSTED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pnpm and Node
        uses: ./.github/actions/setup-pnpm
        with:
          node-version: '24'

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Generate native app icons
        run: pnpm desktop:icons

      - name: Build Windows installer and stage release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tauriScript: pnpm dlx @tauri-apps/cli@2
          args: '--bundles nsis'
          tagName: ${{ github.event_name != 'pull_request' && 'desktop-v__VERSION__' || '' }}
          releaseName: 'Gridfinity Layout Tool Desktop v__VERSION__'
          releaseBody: 'Offline Windows installer (x64) with bundled WebView2 runtime. See docs/desktop.md for offline features and limitations.'
          releaseDraft: true
          prerelease: false

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build-windows
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish verified Windows installer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          gh release edit "desktop-v${VERSION}" --repo "${GITHUB_REPOSITORY}" --draft=false
